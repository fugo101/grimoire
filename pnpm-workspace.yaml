allowBuilds:
  # Pulled in by next-intl for its message extractor, which this app does not
  # use. Their install scripts would try to build native code, and the
  # self-hosted runner has no build toolchain.
  "@parcel/watcher": false
  "@swc/core": false
  better-sqlite3: true
  esbuild: true
  sharp: true

overrides:
  postcss@<8.5.18: ">=8.5.18"
  esbuild@<0.25.0: ">=0.25.0"
  source-map-js@<1.2.2: ">=1.2.2"
  # vite reaches us only as vitest's peer. Held to ^8 — vitest's own peer
  # range — so a future vite major cannot ride in through this line.
  vite@<8.2.4: "^8.2.4"
  # Crosses a major: every parent (eslint, typescript-eslint, ts-morph) asks
  # for ^10, and no 10.x carries the fix. v11 removed makeRe()/regexp/AST,
  # none of which those parents call — they use minimatch() and new Minimatch().
  minimatch@<11.0.1: "^11.0.1"

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (deep-nesting DoS). No patched release exists yet — 3.0.3
    # is the latest on npm — so neither a bump nor an override can clear it.
    # Only reached through lint/CLI tooling (@next/eslint-plugin-next, shadcn)
    # via fast-glob > micromatch, never at runtime. Remove this once braces
    # ships a fix and add a `braces@<3.0.4` override in its place.
    - GHSA-vfj7-8cjw-p6xm
