version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps)"
    groups:
      npm-production:
        dependency-type: "production"
        patterns: ["*"]
      npm-development:
        dependency-type: "development"
        patterns: ["*"]
